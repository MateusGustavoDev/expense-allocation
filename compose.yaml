# Ambiente de desenvolvimento local.
# O código é montado via volume, então alterações refletem sem rebuild.

x-php: &php
  build:
    context: .
    target: development
    args:
      # uid/gid do usuário do host (Linux): quem roda "id -u" diferente de 1000 define USER_ID/GROUP_ID no .env
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: expense-allocation-php
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *php
    ports:
      - "${APP_PORT:-8000}:8080"

  # Mesmo código e imagem do app, rodando apenas o worker da fila
  queue:
    <<: *php
    command: ["php", "/var/www/html/artisan", "queue:work"]
    # Worker sobe de novo se cair (ex.: primeira subida, antes das migrations)
    restart: unless-stopped
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  # Executa as tarefas agendadas (routes/console.php), como a varredura de conversões pendentes
  scheduler:
    <<: *php
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    restart: unless-stopped
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      # node_modules isolado no container: dependências nativas (Tailwind, Rollup) são compiladas para Linux
      - node-modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  node-modules:
